services:
  payment:
    build: ./payment-service
    container_name: payment
    ports: ["8081:8081"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: toxiproxy
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes: ["./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro"]
    ports: ["8474:8474"]
    depends_on: [payment]

  order:
    build: ./order-service
    container_name: order
    command:
      - "--payment.base-url=http://toxiproxy:8666"
      - "--resilience.config=${RESILIENCE_CONFIG:-C0}"
    ports: ["8080:8080"]
    depends_on: [toxiproxy]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
    depends_on: [prometheus]

  k6:
    image: grafana/k6:0.52.0
    profiles: ["load"]
    user: "1000:1000"
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
