server.port=8080
# Pool de threads borné, identique pour toutes les configurations
server.tomcat.threads.max=50
# Expose les métriques des threads Tomcat (threads occupés)
server.tomcat.mbeanregistry.enabled=true
management.endpoints.web.exposure.include=health,prometheus,metrics
# Adresse du Service B (plus tard : Toxiproxy)
payment.base-url=http://localhost:8081
# Configuration de résilience : C0, C1, C2, C3 ou C4
resilience.config=C0
resilience.timeout-ms=1000